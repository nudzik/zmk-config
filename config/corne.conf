# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y

#CONFIG_ZMK_USB_LOGGING=y
#CONFIG_ZMK_LOG_LEVEL=4

#CONFIG_ZMK_SPLIT=y
#CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
#CONFIG_ZMK_SPLIT_BLE=y

#Studio Disable https://github.com/zmkfirmware/zmk/issues/3195
#CONFIG_ZMK_STUDIO=y
#CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_HID_REPORT_TYPE_HKRO=n
CONFIG_ZMK_HID_KEYBOARD_REPORT_SIZE=6

#CONFIG_USB
CONFIG_USB_DEVICE_VID=0x1D50
CONFIG_USB_DEVICE_PID=0x615E
CONFIG_USB_DEVICE_MANUFACTURER="ZMK Project"
CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_USB_HID_BOOT_PROTOCOL=y
CONFIG_ZMK_USB=y	
CONFIG_ZMK_USB_BOOT=y
CONFIG_ZMK_USB_INIT_PRIORITY=50

#Power Management
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

#battery report
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

#battery report2
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y

#CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y
#CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1
#CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_QUEUE_SIZE=5
#CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=5
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y


#mouse control
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y


#debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=7
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
#CONFIG_ZMK_KSCAN_DEBOUNCE_SCAN_PERIOD_MS=3




# Bluetooth tweaks
#CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
#CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y
#CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
#CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

#fix disconnections problems
CONFIG_BT_CTLR_PHY_2M=n

#new
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_CONSUMER_REPORT_QUEUE_SIZE=5
CONFIG_ZMK_BLE_KEYBOARD_REPORT_QUEUE_SIZE=20
